name: Verify changes

on: [pull_request]

jobs:
  verify-offline:
    runs-on: ubuntu-latest

    name: verify (offline)

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          cache: "pnpm"
          node-version: 22.x

      - run: pnpm install --frozen-lockfile

      # Shared offline verification: lint, typecheck, unit tests that do not
      # need external tools, server build, a real stdio LSP smoke session with
      # optional tools (ShellCheck, shfmt, man) unavailable, and package
      # content checks. Writes artifacts/verify-manifest.json.
      - name: Verify changes (offline)
        run: pnpm run verify:offline

      - name: Upload verification manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-manifest
          path: artifacts/
          if-no-files-found: ignore

  external-tools:
    runs-on: ubuntu-latest

    name: external tools (${{ matrix.shfmt-version }} shfmt)

    strategy:
      fail-fast: false
      matrix:
        # shfmt occasionally changes its output and its error messages, which
        # the formatter tests assert on. The archive version lags well behind,
        # so also test the latest release to catch such changes when they happen
        # rather than when a user reports them.
        shfmt-version: [distro, latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck (used for testing)
        run: sudo apt-get install -y shellcheck

      - name: Install shfmt from the Ubuntu archive (used for testing)
        if: matrix.shfmt-version == 'distro'
        run: sudo apt-get install -y shfmt

      - name: Install the latest shfmt release (used for testing)
        if: matrix.shfmt-version == 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo mvdan/sh --json tagName --jq .tagName)
          sudo curl -fsSL -o /usr/local/bin/shfmt \
            "https://github.com/mvdan/sh/releases/download/$tag/shfmt_${tag}_linux_amd64"
          sudo chmod +x /usr/local/bin/shfmt

      - name: Show which shfmt is used
        run: |
          command -v shfmt
          shfmt --version

      - uses: pnpm/action-setup@v6

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          cache: "pnpm"
          node-version: 22.x

      - run: pnpm install --frozen-lockfile

      # With the external executables installed, the tool-dependent tests
      # (which skip themselves when a tool is missing, see testing/tools.ts)
      # run for real. The offline job covers everything else.
      - name: Run the test suite with external tools available
        run: pnpm exec jest --runInBand

  all-done:
    needs:
      - verify-offline
      - external-tools
    runs-on: ubuntu-latest
    steps:
    - run: echo "All jobs completed"
