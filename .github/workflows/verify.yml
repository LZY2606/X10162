name: Verify changes

on: [pull_request]

jobs:
  # Shared offline gate: no external tools (ShellCheck/shfmt) are installed.
  # Runs format/type checks, unit tests, the server build, a real stdio LSP
  # smoke session and a package content check, and proves that optional
  # tools degrade gracefully. Tests requiring the real tools are skipped
  # here and covered by the "verify-with-tools" job below.
  verify-offline:

    runs-on: ubuntu-latest

    name: verify (offline)

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          cache: "pnpm"
          node-version: 22.x

      - name: Verify offline
        run: pnpm run verify:offline

  # Tests that genuinely need the external tools (ShellCheck and both the
  # distro and latest shfmt releases).
  verify-with-tools:

    runs-on: ubuntu-latest

    name: verify (${{ matrix.shfmt-version }} shfmt)

    strategy:
      fail-fast: false
      matrix:
        # shfmt occasionally changes its output and its error messages, which
        # the formatter tests assert on. The archive version lags well behind,
        # so also test the latest release to catch such changes when they happen
        # rather than when a user reports them.
        shfmt-version: [distro, latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck (used for testing)
        run: sudo apt-get install -y shellcheck

      - name: Install shfmt from the Ubuntu archive (used for testing)
        if: matrix.shfmt-version == 'distro'
        run: sudo apt-get install -y shfmt

      - name: Install the latest shfmt release (used for testing)
        if: matrix.shfmt-version == 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo mvdan/sh --json tagName --jq .tagName)
          sudo curl -fsSL -o /usr/local/bin/shfmt \
            "https://github.com/mvdan/sh/releases/download/$tag/shfmt_${tag}_linux_amd64"
          sudo chmod +x /usr/local/bin/shfmt

      - name: Show which shfmt is used
        run: |
          command -v shfmt
          shfmt --version

      - uses: pnpm/action-setup@v6

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          cache: "pnpm"
          node-version: 22.x

      - run: pnpm install --frozen-lockfile

      - name: Verify changes (with external tools)
        run: pnpm verify:bail

  all-done:
    needs:
      - verify-offline
      - verify-with-tools
    runs-on: ubuntu-latest
    steps:
    - run: echo "All jobs completed"
